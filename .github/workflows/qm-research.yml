name: Quality Momentum research

on:
  push:
    branches: [claude/project-thread-4vbmx5]
    paths: ["quality-momentum/backtest.py", "quality-momentum/compare_exits.py", ".github/workflows/qm-research.yml"]
  workflow_dispatch:
    inputs:
      start:
        description: "Backtest start date"
        default: "2005-01-01"

jobs:
  compare-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: quality-momentum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quality-momentum/requirements.txt
      - run: pip install -r requirements.txt
      - name: Monthly vs daily-trend exits
        run: python compare_exits.py --start "${{ inputs.start || '2005-01-01' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qm-results
          path: quality-momentum/results/
          if-no-files-found: ignore
