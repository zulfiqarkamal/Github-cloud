name: Quality Momentum auto-trader (paper)

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC on weekdays, after the US close all year
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, place no orders"
        type: boolean
        default: true
      force_monthly:
        description: "Run the monthly rebalance today"
        type: boolean
        default: false

concurrency: autotrader   # never two runs at once

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: quality-momentum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: quality-momentum/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STRATEGY_FRACTION: ${{ vars.STRATEGY_FRACTION || '1.0' }}
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force_monthly }}" = "true" ]; then ARGS="$ARGS --force-monthly"; fi
          python autotrader.py $ARGS
